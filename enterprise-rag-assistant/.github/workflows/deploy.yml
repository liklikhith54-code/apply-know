name: Build and Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-enterprise-rag
  ACR_NAME: enterpriseragacr
  APP_NAME: enterprise-rag-assistant
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        env:
          MOCK_AZURE_SERVICES: "True"
          AZURE_OPENAI_ENDPOINT: "https://mock.openai.azure.com/"
          AZURE_OPENAI_API_KEY: "mock-key"
          AZURE_OPENAI_API_VERSION: "2024-02-15-preview"
          AZURE_OPENAI_CHAT_DEPLOYMENT: "chat-gpt-4o"
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: "text-embedding-3-large"
          AZURE_OPENAI_EMBEDDING_DIMENSIONS: "1536"
          AZURE_SEARCH_ENDPOINT: "https://mock.search.windows.net"
          AZURE_SEARCH_API_KEY: "mock-search-key"
          AZURE_SEARCH_INDEX_NAME: "enterprise-knowledge-index"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=mock;AccountKey=mock;EndpointSuffix=core.windows.net"
          AZURE_STORAGE_CONTAINER: "documents"
        run: pytest --tb=short -q

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Image to ACR
  # ─────────────────────────────────────────
  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
          docker build -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          # Also tag as latest
          docker tag "$IMAGE" "${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest"
          docker push "${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:latest"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "✅ Pushed: $IMAGE"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Azure App Service
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to App Service
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to App Service
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }} \
            --docker-custom-image-name "${{ needs.build.outputs.image }}" \
            --output none
          echo "✅ Deployed: ${{ needs.build.outputs.image }}"

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.APP_NAME }}

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          sleep 30
          URL="https://${{ env.APP_NAME }}.azurewebsites.net/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" == "200" ]; then
            echo "✅ Health check passed: $URL"
          else
            echo "❌ Health check failed with status $STATUS"
            exit 1
          fi

      - name: Print deployment URL
        run: |
          echo ""
          echo "🚀 Deployment Complete!"
          echo "   App URL  : https://${{ env.APP_NAME }}.azurewebsites.net"
          echo "   Health   : https://${{ env.APP_NAME }}.azurewebsites.net/health"
          echo "   API Docs : https://${{ env.APP_NAME }}.azurewebsites.net/docs"
          echo ""
